version: 2

models:
  - name: silver_station_information
    description: "Fiche actuelle de chaque station (dernière version connue) : nom, position, capacité."
    columns:
      - name: station_id
        description: "Identifiant de la station (entier). Une seule ligne par station."
        data_tests:
          - not_null
          - unique
      - name: station_name
        description: "Nom de la station."
      - name: capacity
        description: "Nombre total de bornes de la station."
        data_tests:
          - not_null:
              config:
                warn_if: ">0"
                error_if: ">10"
